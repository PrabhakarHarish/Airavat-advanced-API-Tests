[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .
addopts =
    -v
    --alluredir=allure-results
    --strict-markers
    --tb=short

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    critical: Critical priority test cases (P1)
    high: High priority test cases (P2)
    security: Security, tenant isolation, and IDOR test cases
    concurrency: Concurrency, race condition, and stress test cases
    financial: Financial precision and calculation engine test cases
    performance: Latency benchmarks and rate limiting test cases
